MEMORY {
    ZP:   start = $80,   size = $70,   type = rw, define = no;
    MAIN: start = $2000, size = $3000, type = rw, file = %O;
    LDR:  start = $1000, size = $0300, type = rw, file = "";
    BSSM: start = $0800, size = $0800, type = rw, file = "";
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    LOADER:   load = MAIN, run = LDR, type = rw, define = yes;
    BSS:      load = BSSM, type = bss;
}
